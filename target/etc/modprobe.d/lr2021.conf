# /etc/modprobe.d/lr2021.conf — module options for the LR2021 driver.
#
# FLRC framing is *dynamic* (variable-length): only the real bytes are
# transmitted and the chip emits a 9-bit on-air length header, so short packets
# (the last fragment of every NAL) no longer pay 511 B of padding airtime.
# Dynamic is now HARDWIRED in the driver (flrc_cfg.mode = 0 at probe) — there is
# no module knob, so this conf intentionally passes NO flrc_mode= option (the
# module would reject an unknown parameter). The driver's compiled defaults
# (CR 3/4, 16-bit CRC, 32-bit preamble/sync, 511 B payload ceiling) are the
# production values, so no `options` line is required at boot; the config-agent
# regenerates this file with explicit RF options when the user changes settings.
#
# On-air A/B, 2026-06-15 (both Pis, prod video stream) that justified dynamic:
#   - equal video delivered at ~14% less channel occupancy (no padding)
#   - 720p ring-saturation knee: fittable payload 1100 -> 1310 kbps (+19%),
#     dropped_full 1785 -> 513 (3.5x fewer), packets/s 354 -> 416
#   - zero regression: k_crc/k_len/sink_err = 0, FEC recovered all misframes
#
# Over-the-air framing must match on both ends; dynamic is the only mode the
# driver now builds, so TX and RX agree by construction. This conf ships to both.
