# /etc/modules-load.d/bcm2835-codec.conf — load the VPU V4L2 M2M codec
# at boot. The codec is a VC firmware service over VCHIQ, not a
# DT-bound hardware device, so it has no modalias and won't be
# auto-loaded by udev.
#
# RX: without it, /dev/video10 (decoder) is missing and GStreamer's
#     v4l2h264dec is not registered -- pivid-rx's display pipeline
#     fails with "WARNING: erroneous pipeline: no element 'v4l2h264dec'".
# TX: without it, /dev/video11 (encoder) is missing and rpicam-vid's
#     H.264 hardware encode path is unavailable.
#
# Loading bcm2835-codec pulls in bcm2835_mmal_vchiq + vc_sm_cma + the
# videobuf2_* family + videodev + mc via module dependencies; the
# single name below is sufficient.
bcm2835-codec
