# /etc/modules-load.d/bcm2835-isp.conf — load the VC4 ISP service at boot
# on the TX Pi. The ISP is a VC firmware service over VCHIQ, not a
# DT-bound hardware device, so it has no modalias and won't be
# auto-loaded by udev. Without this file the ISP V4L2 nodes
# (/dev/video13..16) are missing, libcamera's rpi/vc4 pipeline
# handler can't initialise, and rpicam-apps fails its platform probe
# with "ERROR: rpicam-apps currently only supports the Raspberry Pi
# platforms" -- even though the camera sensor itself is bound.
#
# Loading bcm2835-isp pulls in bcm2835_mmal_vchiq + vc_sm_cma + the
# videobuf2_* family via module dependencies; the single name below
# is sufficient.
bcm2835-isp
