# /etc/tmpfiles.d/pivid-dma-heap-compat.conf — bridge the dma-heap
# name that rpicam-apps expects to the one this kernel actually
# exposes.
#
# Kernel 6.18 (the +rpt-rpi-v8 build) with `cma=128M` on the kernel
# command line registers the CMA dma-heap as
# /dev/dma_heap/default_cma_region. rpicam-apps 1.12.0 only probes
# /dev/dma_heap/vidbuf_cached and /dev/dma_heap/linux,cma -- if
# neither opens, it prints the misleading "rpicam-apps currently only
# supports the Raspberry Pi platforms" and exits.
#
# systemd-tmpfiles recreates this symlink on every boot (and after
# `systemd-tmpfiles --create`), so it survives reboots without a
# dedicated udev rule.
#
# TX-only: RX uses GStreamer + V4L2 directly and doesn't touch
# libcamera / dma-heaps.
L /dev/dma_heap/linux,cma - - - - default_cma_region
