# /opt/pivid/pivid.conf -- canonical PiVid config (single source of truth).
# Shell-style KEY=value; '#' comments. Read by the pivid-tx/pivid-rx/caster/
# config-agent daemons via --config (no longer shell-sourced; common/settings.c).
# The config web UI rewrites this file atomically; hand-edit only when
# the web UI is unavailable, then `systemctl restart pivid-tx`/`pivid-rx`.
#
# Pairing: identical BINDING_PHRASE on TX and RX derives the same radio
# sync word (ELRS-style). The FLRC params below are over-the-air framing and
# MUST also match end-to-end.

# --- [pairing] ---
BINDING_PHRASE="pivid-default"

# --- [rf] --- (FLRC: Live tier; TX and RX MUST match)
FLRC_MODE=0
FLRC_CR=1
FLRC_CRC_WIDTH=1
FLRC_PREAMBLE_LEN=7
FLRC_SYNC_LEN=2
FLRC_PLD_LEN=511
FLRC_TX_LOW_THRESH=192
# TIER_MODRELOAD: written to /etc/modprobe.d/lr2021.conf by the config agent and
# passed to the driver as module params. 2100 MHz is on the LR2021 4 MHz FE-cal
# grid (2100/4 = 525). NB it is BELOW the external SZM-2166Y PA's rated
# 2.3-2.7 GHz band -- see docs/DECISIONS.md before transmitting with that amp.
# NOTE: RF_FREQUENCY must match on BOTH TX and RX or the link is dead.
RF_FREQUENCY=2100000000
RF_TX_POWER=-3
# RX-side only (SetRxPath rx_boost; config offers 4..7, ends need NOT match); 4 = non-boosted default
RX_BOOST=4

# --- [camera] ---
WIDTH=640
HEIGHT=480
FPS=30

# --- [encoder] --- (Phase-E-validated droppable recipe; matches recipe_defaults.c)
BITRATE=850000
ENCODER_RECIPE="droppable"
INTRA=30
SLICE_MB=120
DROPPABLE_LEN=8
SPS_REINJECT_MS=0
IDR_PERIOD=60

# --- [fec] --- (validated 9/2/16; FEC always on -- m_anchor/m_ref are never 0)
# m_ref=2, NOT 1: m_ref=1 loses m+1 symbols on ref blocks under bursty loss ->
# visible blocky lines (fec_unrec 12/min -> 0 when raised to 2, +4% airtime).
# Locked decision -- see docs/DECISIONS.md. Matches the compiled default (settings.c) and
# the "droppable" recipe default (recipe_defaults.c); shipping 1 here silently
# overrode both.
FEC_M_ANCHOR=9
FEC_M_REF=2
FEC_K=16

# --- [rx] --- (distribution; RX role)
# Forward video+telemetry to networked PC viewers (pivid-player) via the caster's
# mDNS advert + remote-subscribe path. 0 = only a locally-connected player sees
# the stream. Applied live (SIGHUP to pivid-caster, no stream drop).
FORWARD_TO_PC=0

# --- [msp] --- (MSP telemetry; TX role)
MSP_ENABLED=1
MSP_UART_DEVICE="/dev/ttyAMA0"
MSP_BAUD=115200

# --- [aqm] --- (adaptive frame-drop; TX role)
# enforce = drop whole frames when the TX ring congests (clean RX skip instead
# of the kernel's mid-frame tail-drop). 0 = off. Signal + watermarks use the
# daemon defaults (peak, 40/25/55/45); the recipe tracks ENCODER_RECIPE.
# CSV instrumentation requires PIVID_TX_SAMPLE=1 (enforce alone writes nothing).
# Applying restarts the transmitter.
AQM=enforce

# --- [osd] --- (MSP DisplayPort OSD: TX keyframe cadence + RX reserved cells)
OSD_KEYFRAME_MS=200
OSD_VID_RSSI_CELL=1,1
OSD_VID_LQ_CELL=2,1
